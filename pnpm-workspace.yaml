packages:
  - rsconcept/domain
  - rsconcept/frontend
  - rsconcept/rstool
  - rsconcept/rstool-mcp

autoInstallPeers: true

allowBuilds:
  esbuild: true

# Security floors for transitive deps (GHSA: browserslist <=4.28.6 OOM / prototype write;
# GHSA-27r3-jxmh-p828: body-parser <2.4.0 crash on trailing bytes after compressed body, via MCP SDK → express;
# GHSA-g3hv-75wg-m249: minimatch >=7 <11.0.1 globParts amplification via eslint / typescript-eslint).
# The minimatch floor is scoped to >=7 so eslint-plugin-react keeps the v3 callable export.
# CodeMirror packages must share one copy of state/view — duplicate versions break branded types.
# @opentelemetry/api: OTel 2.12 core/sdk peers cap it <1.10 (pulled in via react-scan → @sentry/node).
overrides:
  '@opentelemetry/api': '~1.9.1'
  body-parser: '^2.4.0'
  browserslist: '>=4.28.7'
  '@codemirror/state': '>=6.7.5'
  '@codemirror/view': '>=6.43.12'
  'minimatch@>=7': '>=11.0.1'

minimumReleaseAgeExclude:
  - '@react-pdf/hyphenate@0.1.1'
