packages:
  - rsconcept/domain
  - rsconcept/frontend
  - rsconcept/rstool
  - rsconcept/rstool-mcp

autoInstallPeers: true

allowBuilds:
  esbuild: true

# Security floors for transitive deps (GHSA: browserslist <=4.28.6 OOM / prototype write).
# CodeMirror packages must share one copy of state/view — duplicate versions break branded types.
overrides:
  browserslist: '>=4.28.7'
  '@codemirror/state': '>=6.7.5'
  '@codemirror/view': '>=6.43.12'

# Versions published inside pnpm 11's 24h minimumReleaseAge window.
minimumReleaseAgeExclude:
  - '@sentry/react@10.75.0'
  - '@tanstack/react-query@5.103.1'
  - '@tanstack/react-query-devtools@5.103.1'
  - '@types/node@26.6.1'
  - lucide-react@1.47.0
  - react-intl@12.1.0
  - '@formatjs/intl@6.1.0'
  - '@sentry/browser-utils@10.75.0'
  - '@sentry/browser@10.75.0'
  - '@sentry/core@10.75.0'
  - '@sentry/feedback@10.75.0'
  - '@sentry/replay-canvas@10.75.0'
  - '@sentry/replay@10.75.0'
  - '@tanstack/query-core@5.103.1'
  - '@tanstack/query-devtools@5.103.1'
  - intl-messageformat@12.1.0
