packages:
  - rsconcept/domain
  - rsconcept/frontend
  - rsconcept/rstool
  - rsconcept/rstool-mcp

autoInstallPeers: true

allowBuilds:
  esbuild: true

# Security floors for transitive deps (GHSA: browserslist <=4.28.6 OOM / prototype write).
overrides:
  browserslist: '>=4.28.7'

# Versions published inside pnpm 11's 24h minimumReleaseAge window.
minimumReleaseAgeExclude:
  - '@types/node@26.4.1'
  - '@xyflow/react@12.11.6'
  - '@xyflow/system@0.0.82'
  - globals@17.12.0
  - lucide-react@1.39.0
  - react-zoom-pan-pinch@4.1.0
