name: Backend CI

defaults:
  run:
    working-directory: rsconcept/backend

on:
  push:
    branches: ["main"]
    paths:
      - rsconcept/backend/**
      - rsconcept/domain/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/backend.yml
  pull_request:
    branches: ["main"]
    paths:
      - rsconcept/backend/**
      - rsconcept/domain/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/backend.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.12]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: pnpm
      - name: Build model type analyzer
        working-directory: .
        run: |
          pnpm install --frozen-lockfile --filter @rsconcept/domain
          pnpm --filter @rsconcept/domain run build:model-types
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run pylint project apps
          uv run mypy project apps
      - name: Run Tests
        if: "!cancelled()"
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run
          uv run python manage.py test
  notify-failure:
    permissions: {}
    runs-on: ubuntu-latest
    needs: build
    if: failure()
    defaults:
      run:
        working-directory: .
    steps:
      - name: Send Telegram Notification
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="❌ Backend build failed! Repository: ${{ github.repository }} Commit: ${{ github.sha }}"
